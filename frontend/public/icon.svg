<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="poleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Cream background with rounded corners (stands out on home screen) -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="#F5EFE1"/>

  <!-- Barber pole cylinder -->
  <g transform="translate(156 80)">
    <!-- Top cap -->
    <ellipse cx="100" cy="22" rx="96" ry="20" fill="url(#poleGold)"/>
    <rect x="4" y="22" width="192" height="20" fill="url(#poleGold)"/>
    <rect x="10" y="40" width="180" height="14" fill="#8B6914" opacity="0.3"/>

    <!-- Pole body with diagonal stripes (barber pole signature) -->
    <clipPath id="pole">
      <rect x="12" y="54" width="176" height="280" rx="4"/>
    </clipPath>
    <g clip-path="url(#pole)">
      <rect x="12" y="54" width="176" height="280" fill="#FFFFFF"/>
      <!-- Diagonal red + blue stripes -->
      <g transform="skewX(-30)">
        <rect x="-50" y="54" width="50" height="280" fill="url(#red)"/>
        <rect x="20" y="54" width="50" height="280" fill="url(#blue)"/>
        <rect x="90" y="54" width="50" height="280" fill="url(#red)"/>
        <rect x="160" y="54" width="50" height="280" fill="url(#blue)"/>
        <rect x="230" y="54" width="50" height="280" fill="url(#red)"/>
      </g>
    </g>
    <!-- Glass shine -->
    <rect x="22" y="54" width="32" height="280" fill="#FFFFFF" opacity="0.25" rx="4"/>
    <!-- Bottom cap -->
    <rect x="10" y="328" width="180" height="14" fill="#8B6914" opacity="0.3"/>
    <rect x="4" y="336" width="192" height="20" fill="url(#poleGold)"/>
    <ellipse cx="100" cy="356" rx="96" ry="18" fill="url(#poleGold)"/>
  </g>

  <!-- Subtle "B" monogram overlay -->
  <text x="256" y="462" font-family="Georgia, serif" font-weight="900" font-size="58"
        fill="#0a0a0a" text-anchor="middle" letter-spacing="2">BERBER</text>
</svg>
