<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Berber - حلاقة فاخرة لباب بيتك" />

    <!-- Privacy: do not index -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="bingbot" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon.svg" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Berber" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Berber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Unregister old SWs + clear caches to break any stale preview,
      // then register the fresh SW. This guarantees the live preview
      // always serves the latest code.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            const current = regs.find((r) => r.active && r.active.scriptURL.endsWith("/sw.js"));
            // If no current SW or it's older, wipe caches once
            if (!current || !sessionStorage.getItem("berber_sw_v3")) {
              if ("caches" in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              }
              sessionStorage.setItem("berber_sw_v3", "1");
            }
            await navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" });
            // Tell any waiting SW to take over immediately
            navigator.serviceWorker.ready.then((reg) => {
              if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
              reg.update();
            });
          } catch (e) { /* noop */ }
        });
      }
    </script>
  </body>
</html>
